<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3d5afe">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Équilibre</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f3f4f8;--ink:#14161f;--mut:#6b7185;--card:#fff;--line:#e4e6ee;--acc:#3d5afe;--accs:#e8ecff;--p:#ff7a59;--c:#f5b301;--f:#22b5a3;--bad:#e5484d;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0d0f16;--ink:#eceef6;--mut:#8b91a7;--card:#171a24;--line:#262a38;--acc:#7b93ff;--accs:#20264a;--on:#0d0f16}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
#v{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 0}
h1{font-size:1.7rem;margin:0;letter-spacing:-.02em}h3{font-size:1rem;margin:0}
small,.mut{color:var(--mut)}small{display:block;font-size:12px}
.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,22,31,.05)}
.rw{position:relative;width:180px;margin:0 auto}.rw svg{width:100%}
.tr,.fg{fill:none;stroke-width:10}.tr{stroke:var(--line)}.fg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dasharray .6s}.fg.ov{stroke:var(--bad)}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.mid b{font-size:2.2rem;line-height:1}.mid span{font-size:12px;color:var(--mut)}
.two{display:flex;justify-content:space-around;text-align:center;margin:12px 0 16px}.two b{display:block;font-size:1.2rem}.two span{font-size:12px;color:var(--mut)}
.mb{margin-top:12px}.mb>div{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}.mb small{display:inline}
.mb i{display:block;height:8px;border-radius:6px;background:var(--line);position:relative;overflow:hidden}
.mb i:after{content:"";position:absolute;inset:0;width:var(--w);background:var(--c);border-radius:6px;transition:width .5s}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:4px}.mh h3{flex:1}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.it>div{flex:1;min-width:0}.it b{font-weight:600}.it>span{font-weight:700}
button{font:inherit;cursor:pointer;color:inherit}
.btn{width:100%;background:var(--acc);color:var(--on);border:0;border-radius:14px;padding:13px;font-weight:700;margin-top:10px}
.btn.s{width:auto;margin:0;padding:11px 18px}
.ghost{background:var(--accs);color:var(--acc);border:0;border-radius:14px;padding:11px 16px;font-weight:600}
.ic{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);font-size:20px;line-height:1}
.pl{background:var(--accs);color:var(--acc);font-weight:700}.x{border:0;background:none;color:var(--mut);padding:6px}.mh .ghost{padding:6px 12px;font-size:13px}
input,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font:inherit;color:inherit;margin-top:4px}
label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:10px}
.row{display:flex;gap:8px;align-items:end;margin-top:10px}.row>*{flex:1;margin-top:0}.row .btn.s{flex:0 0 auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:0 8px}
#reader{border-radius:14px;overflow:hidden;margin-top:10px}
.ns{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:12px;color:#fff;margin:6px 0}
.na{background:#038141}.nb{background:#85bb2f}.nc{background:#fecb02;color:#222}.nd{background:#ee8100}.ne{background:#e63e11}
.ch{width:100%;margin-top:8px}.ch text{fill:var(--mut);font-size:10px}.bb{fill:var(--acc)}.ob{fill:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px "Plus Jakarta Sans",system-ui,sans-serif;padding:6px}
nav button.on{color:var(--acc)}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
:root{--bg:#f6f4ff;--acc:#6c47ff;--accs:#ece8ff;--grad:linear-gradient(135deg,#6c47ff,#2bb3ff)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0a14;--card:#16142a;--acc:#9b85ff;--accs:#26214a;--line:#2a2646}}
.card{border-radius:26px;border:1px solid var(--line);box-shadow:0 8px 30px -14px rgba(80,60,200,.25)}
.hero{background:var(--grad);color:#fff;border:0}.hero .tr{stroke:rgba(255,255,255,.28)}.hero .fg,.hero .fg.ov{stroke:#fff}.hero .fg.ov{stroke:#ffd166}.hero .mid span,.hero .two span{color:rgba(255,255,255,.85)}
.btn{background:var(--grad);color:#fff;border-radius:999px}.ghost{border-radius:999px}
nav{left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;border:1px solid var(--line);border-radius:28px;padding:6px;box-shadow:0 14px 34px -12px rgba(60,40,160,.4)}
nav button.on{background:var(--accs);border-radius:22px}
.mh h3:before{content:attr(data-e) " "}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chips span{background:var(--accs);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;margin:10px 0;font-size:14px}.alert.w{background:#fff1dc;color:#7a4a00}.alert.g{background:#dcf8ec;color:#0b5a3b}
@media(prefers-color-scheme:dark){.alert.w{background:#3a2a0f;color:#ffd48a}.alert.g{background:#0f3326;color:#8ff0c2}}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:9;white-space:nowrap}
.cf{position:fixed;top:-40px;font-size:26px;z-index:8;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="v"></div>
<nav>
<button data-a="go" data-v="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Aujourd’hui</button>
<button data-a="go" data-v="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Ajouter</button>
<button data-a="go" data-v="stats"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Stats</button>
<button data-a="go" data-v="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profil</button>
</nav>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S;try{S=JSON.parse(localStorage.getItem("eq")||"{}")}catch(e){S={}}
if(!localStorage.getItem("eq")){try{const o=JSON.parse(localStorage.getItem("suivi")||"null");if(o){S.log=o.log||{};S.wt=o.weights||{};S.goal=o.goal||2000;S.rec=Object.values(o.custom||{})}}catch(e){}}
S.goal=S.goal||2000;S.mac=S.mac||{p:100,c:230,f:65};S.pr=S.pr||{};S.log=S.log||{};S.rec=S.rec||[];S.wt=S.wt||{};S.water=S.water||{};
const save=()=>{try{localStorage.setItem("eq",JSON.stringify(S))}catch(e){}};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const R=Math.round,r1=n=>Math.round(n*10)/10,MEALS=["Petit-déjeuner","Déjeuner","Dîner","Collation"];
let day=new Date(),tab="today",cur=null,res=[],mm="",qv="",sc=null,fq=0;
let meal=MEALS[(h=>h<10?0:h<15?1:h<18?3:2)(new Date().getHours())];
const key=()=>iso(day);
const tot=dk=>(S.log[dk]||[]).reduce((a,e)=>({k:a.k+e.k,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f,s:a.s+(e.s||0),sl:a.sl+(e.sl||0)}),{k:0,p:0,c:0,f:0,s:0,sl:0});
const setMsg=t=>{mm=t;const m=$("#msg");if(m)m.textContent=t};
const fromOFF=p=>{const n=p.nutriments||{},k=n["energy-kcal_100g"]??(n.energy_100g!=null?n.energy_100g/4.184:null);
return{code:p.code,name:[p.product_name,p.brands&&p.brands.split(",")[0]].filter(Boolean).join(" – "),k:k==null?null:R(k),p:r1(n.proteins_100g||0),c:r1(n.carbohydrates_100g||0),f:r1(n.fat_100g||0),s:r1(n.sugars_100g||0),sl:r1(n.salt_100g||0),ns:"abcde".includes(p.nutriscore_grade)?p.nutriscore_grade:""}};
const mb=(n,v,x,c)=>`<div class="mb"><div><span>${n}</span><b>${R(v)}<small> / ${x}${n==="Eau"?"":" g"}</small></b></div><i style="--w:${Math.min(100,v/x*100)}%;--c:var(${c})"></i></div>`;
const alerts=(t,w,wg)=>{const a=[],sg=S.goal*.1/4;
if(t.p>0&&t.p>=S.mac.p)a.push(["g","💪","Objectif protéines atteint, bravo !"]);
if(w>0&&w>=wg)a.push(["g","💧","Objectif eau atteint, bien joué !"]);
if(t.s>sg)a.push(["w","🍬",`Petit point d’attention : ${r1(t.s)} g de sucres aujourd’hui, au-dessus du repère d’environ ${R(sg)} g (10 % des calories, OMS). Les sucres naturels des fruits et du lait sont inclus.`]);
if(t.sl>5)a.push(["w","🧂",`Petit point d’attention : ${r1(t.sl)} g de sel, au-dessus du repère de 5 g par jour (OMS).`]);
return a.map(([c,e,m])=>`<div class="alert ${c}"><span>${e}</span><span>${m}</span></div>`).join("")};
const warn=c=>[c.s>22.5&&`Riche en sucres (${c.s} g / 100 g)`,c.sl>1.5&&`Riche en sel (${c.sl} g / 100 g)`].filter(Boolean).map(m=>`<div class="alert w"><span>⚠️</span><span>${m}</span></div>`).join("");
const toast=m=>{let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","status");document.body.append(t)}t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)};
const burst=()=>{if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;for(let i=0;i<16;i++){const s=document.createElement("span");s.className="cf";s.textContent=["🎉","💪","⭐","🔥"][i%4];s.style.left=Math.random()*95+"vw";s.style.animationDelay=Math.random()*.5+"s";document.body.append(s);setTimeout(()=>s.remove(),2600)}};
const cele=b=>{const a=tot(key());if(b.p<S.mac.p&&a.p>=S.mac.p){toast("🎉 Objectif protéines atteint, bravo !");burst()}else toast("✅ Ajouté")};
const V={
today(){const dk=key(),t=tot(dk),g=S.goal,left=g-t.k,C=339.3,L=S.log[dk]||[],w=S.water[dk]||0,wg=S.wg||2000,yd=new Date(day),yl=(yd.setDate(yd.getDate()-1),S.log[iso(yd)]||[]);
return `<div class="top"><div><div class="mut">${day.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</div><h1>${dk===iso(new Date())?"Aujourd’hui":"Journal"}</h1></div><div><button class="ic" data-a="prev" aria-label="Jour précédent">‹</button> <button class="ic" data-a="next" aria-label="Jour suivant">›</button></div></div>
<section class="card hero"><div class="rw"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="54"/><circle class="fg${left<0?" ov":""}" cx="60" cy="60" r="54" stroke-dasharray="${C*Math.min(1,t.k/g)} ${C}" transform="rotate(-90 60 60)"/></svg><div class="mid"><b>${R(Math.abs(left))}</b><span>kcal ${left<0?"au-dessus":"restantes"}</span></div></div>
<div class="two"><div><b>${R(t.k)}</b><span>mangées</span></div><div><b>${g}</b><span>objectif</span></div></div>
</section>${alerts(t,w,wg)}<section class="card">${mb("Protéines",t.p,S.mac.p,"--p")}${mb("Glucides",t.c,S.mac.c,"--c")}${mb("Lipides",t.f,S.mac.f,"--f")}<div class="chips"><span>🍬 Sucres ${r1(t.s)} g</span><span>🧂 Sel ${r1(t.sl)} g</span></div></section>
<section class="card">${mb("Eau",w,wg,"--acc").replace(" / "," / ").replace("</small>"," ml</small>")}<div class="row"><button class="ghost" data-a="water" data-v="-250">− 250</button><button class="btn s" data-a="water" data-v="250">+ 250 ml</button></div></section>
${MEALS.map(m=>{const es=L.filter(e=>e.meal===m);return `<section class="card"><div class="mh"><h3 data-e="${["🥐","🥗","🍝","🍎"][MEALS.indexOf(m)]}">${m}</h3><span class="mut">${R(es.reduce((a,e)=>a+e.k,0))} kcal</span>${!es.length&&yl.some(e=>e.meal===m)?`<button class="ghost" data-a="copy" data-v="${m}">Répéter hier</button>`:""}<button class="ic pl" data-a="addto" data-v="${m}" aria-label="Ajouter à ${m}">+</button></div>${es.map(e=>`<div class="it"><div><b>${esc(e.name)}</b><small>${e.g} g · P ${r1(e.p)} · G ${r1(e.c)} · L ${r1(e.f)}</small></div><span>${R(e.k)}</span><button class="x" data-a="del" data-v="${e.id}" aria-label="Supprimer">✕</button></div>`).join("")}</section>`}).join("")}`},
add(){return `<h1 style="margin-bottom:14px">Ajouter</h1><section class="card"><button class="btn" style="margin:0" data-a="scan">Scanner un code-barres</button>
<div id="scan" hidden><div id="reader"></div><button class="ghost" style="margin-top:8px" data-a="stop">Fermer la caméra</button></div>
<div class="row"><label style="margin:0">Nom ou code<input id="q" value="${esc(qv)}" placeholder="yaourt nature, 3017620422003…" enterkeyhint="search"></label><button class="btn s" data-a="search">Chercher</button></div>
<p id="msg" class="mut" role="status">${esc(mm)}</p>${res.map((p,i)=>`<div class="it"><div><b>${esc(p.name)}</b><small>${p.k} kcal / 100 g</small></div><button class="ghost" data-a="pick" data-v="${i}">Choisir</button></div>`).join("")}
<div class="row"><button class="ghost" data-a="manual">Créer un aliment</button><button class="ghost" data-a="quick">Ajout rapide (kcal)</button></div></section>
${cur?`<form class="card" id="fm"><h3>${cur.name?esc(cur.name):"Nouvel aliment"}</h3>${cur.ns?`<span class="ns n${cur.ns}">Nutri-Score ${cur.ns.toUpperCase()}</span>`:""}
<label>Nom<input name="name" value="${esc(cur.name)}" required></label>
<div class="g4"><label>kcal<input name="k" type="number" step="any" min="0" value="${cur.k}" required></label><label>Prot.<input name="p" type="number" step="any" min="0" value="${cur.p}"></label><label>Gluc.<input name="c" type="number" step="any" min="0" value="${cur.c}"></label><label>Lip.<input name="f" type="number" step="any" min="0" value="${cur.f}"></label></div><div class="g4"><label>Sucres<input name="s" type="number" step="any" min="0" value="${cur.s||0}"></label><label>Sel<input name="sl" type="number" step="any" min="0" value="${cur.sl||0}"></label></div>${warn(cur)}<small>${cur.q?"Saisis le total de calories et laisse la quantité à 100 g.":"Valeurs pour 100 g"}</small>
<div class="row"><label>Quantité (g)<input name="g" type="number" step="any" min="1" value="${cur.g||100}" required></label><label>Repas<select name="meal">${MEALS.map(m=>`<option${m===meal?" selected":""}>${m}</option>`).join("")}</select></label></div>
<button class="btn" type="submit">Ajouter · <span id="pvk">0</span> kcal</button></form>`:""}
<section class="card"><h3>Favoris et récents</h3><small>Le + ajoute tout de suite à : ${meal}</small>${S.rec.length?S.rec.slice(0,20).map((r,i)=>`<div class="it"><div><b>${esc(r.name)}</b><small>${r.g||100} g · ${R(r.k*(r.g||100)/100)} kcal</small></div><button class="x" data-a="rdel" data-v="${i}" aria-label="Retirer">✕</button><button class="x" data-a="fav" data-v="${i}" aria-label="Favori">${r.fav?"★":"☆"}</button><button class="ghost" data-a="rec" data-v="${i}">Modifier</button><button class="ic pl" data-a="qadd" data-v="${i}" aria-label="Ajouter tout de suite">+</button></div>`).join(""):`<p class="mut">Les aliments que tu ajoutes apparaissent ici pour les retrouver en un tap.</p>`}</section>`},
stats(){const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return{l:d.toLocaleDateString("fr-FR",{weekday:"narrow"}),k:tot(iso(d)).k}});
const mx=Math.max(S.goal*1.25,...days.map(d=>d.k)),lg=days.filter(d=>d.k>0),gy=100-S.goal/mx*90;
const bars=days.map((d,i)=>{const h=d.k/mx*90;return `<rect x="${i*40+6}" y="${100-h}" width="28" height="${h}" rx="7" class="${d.k>S.goal?"ob":"bb"}"/><text x="${i*40+20}" y="116" text-anchor="middle">${d.l}</text>`}).join("");
const ws=Object.keys(S.wt).sort().slice(-30),vs=ws.map(k=>S.wt[k]);let wc="",wd="";
if(vs.length>1){const lo=Math.min(...vs),sp=(Math.max(...vs)-lo)||1,d=vs[vs.length-1]-vs[0];wd=` · ${d>0?"+":""}${r1(d)} kg depuis le ${ws[0].split("-").reverse().slice(0,2).join("/")}`;
wc=`<svg viewBox="0 0 280 90" class="ch"><polyline fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${vs.map((v,i)=>`${8+i*264/(vs.length-1)},${80-(v-lo)/sp*70}`).join(" ")}"/></svg>`}
return `<h1 style="margin-bottom:14px">Stats</h1><section class="card"><h3>7 derniers jours</h3><small>${lg.length?`Moyenne ${R(lg.reduce((a,d)=>a+d.k,0)/lg.length)} kcal · ${lg.length} jour${lg.length>1?"s":""} suivi${lg.length>1?"s":""}`:"Pas encore de données"}</small>
<svg viewBox="0 0 280 122" class="ch">${bars}<line x1="0" x2="280" y1="${gy}" y2="${gy}" stroke="var(--mut)" stroke-dasharray="4 4"/></svg></section>
<section class="card"><h3>Poids</h3><small>${vs.length?`Dernière pesée : ${vs[vs.length-1]} kg${wd}`:"Aucune pesée enregistrée"}</small>${wc}
<div class="row"><label style="margin:0">Poids du jour (kg)<input id="w" type="number" step="0.1" min="0" value="${S.wt[iso(new Date())]??""}"></label><button class="btn s" data-a="wsave">Enregistrer</button></div></section>`},
me(){const p=S.pr,o=(v,l,s)=>`<option value="${v}"${String(s)===String(v)?" selected":""}>${l}</option>`;
return `<h1 style="margin-bottom:14px">Profil</h1><form class="card" id="pf"><h3>Calculer mon objectif</h3>
<div class="g2"><label>Sexe<select name="sex">${o("f","Femme",p.sex)}${o("m","Homme",p.sex)}</select></label><label>Âge<input name="age" type="number" min="16" max="100" value="${p.age||""}" required></label><label>Taille (cm)<input name="h" type="number" min="120" max="230" value="${p.h||""}" required></label><label>Poids (kg)<input name="w" type="number" step="0.1" min="30" max="250" value="${p.w||""}" required></label></div>
<label>Activité<select name="act">${o(1.2,"Sédentaire",p.act)}${o(1.375,"Légère (1–3 séances/sem.)",p.act)}${o(1.55,"Modérée (3–5 séances/sem.)",p.act)}${o(1.725,"Intense (6–7 séances/sem.)",p.act)}</select></label>
<label>Objectif<select name="goal">${o("lose","Perdre du poids (−15 %)",p.goal)}${o("keep","Maintenir mon poids",p.goal)}${o("gain","Prendre du poids (+10 %)",p.goal)}</select></label>
<button class="btn" type="submit">Calculer</button><small style="margin-top:8px">Estimation indicative (formule de Mifflin-St Jeor), avec un plancher de sécurité. Elle ne remplace pas l’avis d’un professionnel de santé.</small></form>
<section class="card"><h3>Mes objectifs du jour</h3><div class="g2"><label>Calories<input type="number" data-o="goal" value="${S.goal}"></label><label>Protéines (g)<input type="number" data-o="mac.p" value="${S.mac.p}"></label><label>Glucides (g)<input type="number" data-o="mac.c" value="${S.mac.c}"></label><label>Lipides (g)<input type="number" data-o="mac.f" value="${S.mac.f}"></label></div></section>
<section class="card"><h3>Mes données</h3><small>Elles restent sur cet appareil. Exporte une sauvegarde pour les garder ou les passer d’un appareil à l’autre.</small><div class="row"><button class="ghost" data-a="exp">Exporter</button><label class="ghost" style="margin:0;text-align:center;cursor:pointer">Importer<input type="file" id="imp" accept="application/json" hidden></label></div></section>`}};
function render(){$("#v").innerHTML=V[tab]();$$("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===tab));pv();if(fq&&$("#fm")){fq=0;const n=$("#fm [name=name]"),g=$("#fm [name=g]"),t=n.value?g:n;t.focus();if(t.select)t.select();$("#fm").scrollIntoView({block:"center"})}}
const pv=()=>{const fm=$("#fm");if(!fm)return;const d=new FormData(fm);$("#pvk").textContent=R((+d.get("k")||0)*(+d.get("g")||0)/100)};
const stop=async()=>{try{if(sc){await sc.stop();sc.clear()}}catch(e){}sc=null;const s=$("#scan");if(s)s.hidden=true};
async function lookup(c){fq=1;c=c.replace(/\D/g,"");const r=S.rec.find(x=>x.code===c);if(r){cur={...r};return render()}
setMsg("Recherche du produit…");const man={code:c,name:"",k:"",p:0,c:0,f:0};
try{const j=await(await fetch(`https://world.openfoodfacts.org/api/v2/product/${c}.json?fields=code,product_name,brands,nutriments,nutriscore_grade`)).json();
if(j.status===1){const p=fromOFF({...j.product,code:c});if(p.k!=null){cur=p;mm="";return render()}}
mm="Produit introuvable : saisis ses valeurs une fois, il sera retenu.";cur=man}catch(e){mm="Pas de connexion à Open Food Facts : saisie manuelle.";cur=man}render()}
async function find(v){setMsg("Recherche…");try{const j=await(await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(v)}&search_simple=1&action=process&json=1&page_size=8&lc=fr&fields=code,product_name,brands,nutriments,nutriscore_grade`)).json();
res=(j.products||[]).map(fromOFF).filter(p=>p.k!=null&&p.name);mm=res.length?"":"Aucun résultat. Essaie un autre mot ou la saisie manuelle."}catch(e){mm="Pas de connexion à Open Food Facts."}render()}
const A={
go(v){stop();tab=v;render();scrollTo(0,0)},
prev(){day.setDate(day.getDate()-1);render()},next(){day.setDate(day.getDate()+1);render()},
water(v){const k=key(),b=S.water[k]||0,wg=S.wg||2000;S.water[k]=Math.max(0,b+ +v);save();render();if(b<wg&&S.water[k]>=wg){toast("💧 Objectif eau atteint !");burst()}},
del(id){S.log[key()]=(S.log[key()]||[]).filter(e=>e.id!=id);save();render()},
addto(m){meal=m;A.go("add")},
manual(){cur={code:"",name:"",k:"",p:0,c:0,f:0};render()},
quick(){fq=1;cur={code:"",name:"Ajout rapide",k:"",p:0,c:0,f:0,g:100,q:1};render()},
copy(m){const yd=new Date(day);yd.setDate(yd.getDate()-1);(S.log[key()]=S.log[key()]||[]).push(...(S.log[iso(yd)]||[]).filter(e=>e.meal===m).map((e,i)=>({...e,id:Date.now()+i})));save();render()},
fav(i){S.rec[i].fav=!S.rec[i].fav;S.rec.sort((a,b)=>!!b.fav-!!a.fav);save();render()},
rdel(i){S.rec.splice(i,1);save();render()},
qadd(i){const r=S.rec[i],g=r.g||100,q=g/100,b=tot(key());(S.log[key()]=S.log[key()]||[]).push({id:Date.now(),name:r.name,g,meal,k:r.k*q,p:r.p*q,c:r.c*q,f:r.f*q,s:(r.s||0)*q,sl:(r.sl||0)*q});S.rec.unshift(S.rec.splice(i,1)[0]);S.rec.sort((x,y)=>!!y.fav-!!x.fav);save();render();cele(b)},
pick(i){fq=1;cur={...res[i]};render()},
rec(i){fq=1;cur={...S.rec[i]};render()},
search(){const v=$("#q").value.trim();qv=v;if(!v)return;/^\d{8,14}$/.test(v)?lookup(v):find(v)},
async scan(){if(!window.Html5Qrcode)return setMsg("Lecteur indisponible (connexion ?). Saisis le code.");
$("#scan").hidden=false;setMsg("Place le code-barres dans le cadre.");const F=Html5QrcodeSupportedFormats;
sc=new Html5Qrcode("reader",{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E],verbose:false,useBarCodeDetectorIfSupported:true});
try{await sc.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:140},videoConstraints:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}}},async c=>{await stop();lookup(c)},()=>{})}
catch(e){$("#scan").hidden=true;sc=null;setMsg("Caméra inaccessible : autorise-la dans le navigateur (lien en https) ou saisis le code.")}},
stop(){stop();setMsg("")},
add(){const d=Object.fromEntries(new FormData($("#fm"))),g=+d.g,k=+d.k,q=g/100,it={name:d.name,k,p:+d.p||0,c:+d.c||0,f:+d.f||0,s:+d.s||0,sl:+d.sl||0,code:cur.code||"",ns:cur.ns||"",g},b=tot(key());
if(!cur.q){const old=S.rec.find(r=>it.code?r.code===it.code:r.name===it.name);if(old&&old.fav)it.fav=true;S.rec=[it,...S.rec.filter(r=>r!==old)].sort((a,b)=>!!b.fav-!!a.fav).slice(0,40)}
(S.log[key()]=S.log[key()]||[]).push({id:Date.now(),name:it.name,g,meal:d.meal,k:k*q,p:it.p*q,c:it.c*q,f:it.f*q,s:it.s*q,sl:it.sl*q});
meal=d.meal;cur=null;res=[];qv="";mm="";save();tab="today";render();scrollTo(0,0);cele(b)},
wsave(){const v=parseFloat($("#w").value);if(v>0){S.wt[iso(new Date())]=v;save();render()}},
calc(){const p=Object.fromEntries(new FormData($("#pf"))),w=+p.w,m=p.sex==="m";
const k=(10*w+6.25*+p.h-5*+p.age+(m?5:-161))*+p.act*({lose:.85,keep:1,gain:1.1}[p.goal]);
S.pr=p;S.goal=Math.max(m?1500:1200,R(k/10)*10);const pr=R(1.6*w),fa=R(S.goal*.28/9);
S.mac={p:pr,f:fa,c:Math.max(0,R((S.goal-4*pr-9*fa)/4))};S.wg=R(w*35/250)*250;save();tab="today";render();scrollTo(0,0)},
exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="equilibre-sauvegarde.json";a.click()}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="fm")A.add();if(e.target.id==="pf")A.calc()});
document.addEventListener("input",pv);
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="q"){e.preventDefault();A.search()}});
document.addEventListener("change",e=>{const t=e.target,o=t.dataset.o;
if(o){const v=+t.value;if(o==="goal")S.goal=v;else S.mac[o.slice(4)]=v;save()}
if(t.id==="imp"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{Object.assign(S,JSON.parse(r.result));save();render()}catch(x){alert("Fichier invalide")}};r.readAsText(t.files[0])}});
render();
</script>
